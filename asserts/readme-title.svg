<svg width="1200" height="260" viewBox="0 0 1200 260"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#00ff88" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="#111111"/>

  <ellipse
    cx="600"
    cy="130"
    rx="520"
    ry="115"
    fill="url(#glow)"
  />

  <text
    x="600"
    y="125"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="62"
    font-weight="800"
    letter-spacing="3"
    fill="#f5f5f5"
    filter="url(#textGlow)"
  >
    My 3D PORTFOLIO
  </text>

  <rect
    x="390"
    y="160"
    width="420"
    height="3"
    rx="2"
    fill="#00ff88"
    filter="url(#textGlow)"
  />

</svg>
